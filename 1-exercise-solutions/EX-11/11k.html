  <body>
    
    <script>
      
      function countPositive(nums) {
        let j = 0;
        for (let i = 0; i <= nums.length-1; i++) {
          
          if (nums[i] > 0) {
            j+=1;
          }
        }
        return j;
      }

      console.log(countPositive([9,2,-1]));
    </script>
  </body>
