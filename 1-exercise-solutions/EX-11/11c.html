    <script>
      function arraySwap(array) {
        const first = array[0];
        const last = array[array.length - 1];
        array[0] = last;
        array[array.length - 1] = first;

        return array;
      }

      console.log(arraySwap([3,5,6,7]));
    </script>
  </body>
