  <body>
    
    <script>
      
      function minMax(nums) {
        let min = [0];
        let max = [0];
        for (let i = 0; i <= nums.length-1; i++) {
          
          if (nums[i] < min[0]) {
            min[0] = nums[i];
          }
          if (nums[i] > max[0]) {
            max[0] = nums[i];
          }
        }
        console.log(`min: ${min[0]}, max: ${max[0]}`);
        
      }

      minMax([9,2,-1]);
    </script>
  </body>
