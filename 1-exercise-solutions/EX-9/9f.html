<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <input placeholder="Name" 
    onkeydown="
    if (event.key == 'Enter') {
      nameUpdate();
    }
    "
    class="js-name-input">

    <button onclick="
      nameUpdate();
    ">Submit</button>

    <p class="js-message"></p>
    <script>
     function nameUpdate() {
      const inputElement = document.querySelector('.js-name-input');
      document.querySelector('.js-message')
        .innerHTML = `Your name is: ${inputElement.value}`;
     }

    </script>
  </body>
</html>
