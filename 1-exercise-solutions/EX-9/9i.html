<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
      updateCartQuantity(2);
    ">+2</button>

    <button onclick="
      updateCartQuantity(3);
    ">+3</button>

    <button onclick="
      updateCartQuantity(4);
    ">+4</button>

    <button onclick="
      updateCartQuantity(5);
    ">+5</button>

    <!-- vvv This code was changed. vvv -->
    <button onclick="
      updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
      updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
      updateCartQuantity(-3);
    ">-3</button>
    <!-- ^^^ This code was changed. ^^^ -->

    <button onclick="
      cartQuantity = 0;
      cartQp();
    ">Reset Cart</button>

    <p class = 'js-cartquantity'></p>

    <script>
      let cartQuantity = 0;
      function updateCartQuantity(button) {
        if (cartQuantity + button > 10) {
        alert('The cart is full');
        return;
      } 
      if (cartQuantity + button < 0) {
        alert('Not enough items in the cart');
        return;
      }
      
        cartQuantity += button;
        cartQp();
      
      }
      function cartQp() {
        document.querySelector('.js-cartquantity').innerHTML = `Cart quantity: ${cartQuantity}`;
      }
    </script>
  </body>
</html>
